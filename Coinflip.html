<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: radial-gradient(120% 140% at 50% -10%, #ffffff 0%, #f4f6f5 55%, #eef1f0 100%);
        min-height: 100%;
        color: #0A0D0C;
        display: flex;
        flex-direction: column;
      }
      .display { font-family: "Space Grotesk", system-ui, sans-serif; }
      #root { flex: 1; }
      .app-footer { padding: 24px; text-align: center; }
      .app-footer img { width: 24px; height: 24px; margin: 0 auto 8px; display: block; filter: drop-shadow(0 0 10px rgba(201,168,118,0.9)) drop-shadow(0 0 30px rgba(201,168,118,0.55)); }
      .app-footer .footer-sub { color: rgba(10,13,12,0.45); font-size: 12px; }

  @keyframes floatGlow {
    0%, 100% { transform: translateY(0px); opacity: .55; }
    50% { transform: translateY(-6px); opacity: .85; }
  }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes spin360 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes coinIdleSpin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .spin { animation: spin360 0.8s linear infinite; }
  .reduce-motion, .reduce-motion * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
</style>

    Loading CoinFlip…

</div>

<script>
  var shownFailure = false;

  function looksLikeThirdPartyError(e) {
    var src = (e && e.filename) || "";
    var msg = (e && e.message) || "";
    var thirdPartyPatterns = [
      "mises_safe_injected", "inpage.js", "contentscript.js",
      "chrome-extension://", "moz-extension://", "safari-extension://"
    ];
    for (var i = 0; i < thirdPartyPatterns.length; i++) {
      if (src.indexOf(thirdPartyPatterns[i]) !== -1) return true;
    }
    if (msg.indexOf("import statement") !== -1) return true;
    return false;
  }

  function showFailureMessage(reason) {
    if (shownFailure) return;
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      shownFailure = true;
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'color:#DC2626;font-family:system-ui,sans-serif;font-size:14px;text-align:center;padding:24px;">' +
        'Failed to load the page.<br/>Check your internet connection and refresh.<br/>' +
        '<span style="opacity:.6;font-size:12px;">(' + (reason || 'unknown error') + ')</span></div>';
    }
  }

  window.addEventListener('error', function (e) {
    if (looksLikeThirdPartyError(e)) return;
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!window.React || !window.ReactDOM || !window.Babel || !window.ethers || (root && !root.dataset.mounted)) {
        showFailureMessage(e.message);
      }
    }, 800);
  });
</script>

<script type="text/plain" id="app-source">
  const { useState, useEffect, useCallback, useMemo, useRef } = React;

  const COINFLIP_ADDRESS = "0x869afB4A96fDe446825fD148dC25da0463192D30";
  const TOKEN_ADDRESS    = "0x12934cb5e37e1eeec80e889df7614febe312ecd9";
  const TOKEN_SYMBOL     = "RIALO";
  const SEPOLIA_CHAIN_ID_HEX = "0xaa36a7";
  const RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";
  const LOG_QUERY_CHUNK = 5000;
  const HISTORY_LOOKBACK_BLOCKS = 200000;
  // How often (ms) to poll for the target block while waiting to resolve a bet
  const RESOLVE_POLL_INTERVAL_MS = 2000;

  const HEADS_IMG = "logo_transparent.png";
  const TAILS_IMG = "icon-app.svg";

  const COINFLIP_ABI = [
    "function placeBet(uint256 amount, bool guessHeads) external returns (uint256 betId)",
    "function resolveBet(uint256 betId) external",
    "function claimRefund(uint256 betId) external",
    "function getBetTiers() view returns (uint256[])",
    "function isValidBet(uint256 amount) view returns (bool)",
    "function paused() view returns (bool)",
    "function houseBalance() view returns (uint256)",
    "function isResolvable(uint256 betId) view returns (bool)",
    "function getBet(uint256 betId) view returns (tuple(address player, uint256 amount, bool guessHeads, uint256 targetBlock, bool resolved, bool refunded, bool result, bool won, uint256 payout))",
    "event BetPlaced(uint256 indexed betId, address indexed player, uint256 amount, bool guessHeads, uint256 targetBlock)",
    "event Flipped(uint256 indexed betId, address indexed player, uint256 amount, bool guessHeads, bool result, bool won, uint256 payout)",
    "event BetRefunded(uint256 indexed betId, address indexed player, uint256 amount)",
  ];

  const ERC20_ABI = [
    "function balanceOf(address account) view returns (uint256)",
    "function decimals() view returns (uint8)",
    "function allowance(address owner, address spender) view returns (uint256)",
    "function approve(address spender, uint256 amount) returns (bool)",
  ];

  const c = {
    panel: "#FFFFFF",
    field: "#F3F5F4",
    card: "#F7F9F8",
    border: "rgba(10,13,12,0.10)",
    borderSoft: "rgba(10,13,12,0.06)",
    textFaint: "rgba(10,13,12,0.38)",
    textMuted: "rgba(10,13,12,0.60)",
    textMain: "#0A0D0C",
    mint: "#0D9488",
    mintBorder: "rgba(13,148,136,0.35)",
    mintBg: "rgba(13,148,136,0.09)",
    gold: "#B7791F",
    goldBorder: "rgba(183,121,31,0.35)",
    goldBg: "rgba(183,121,31,0.10)",
    danger: "#DC2626",
    dangerBg: "rgba(220,38,38,0.08)",
  };

  function fmt(amount, decimals) {
    if (amount === null || amount === undefined) return "0";
    const n = Number(ethers.formatUnits(amount, decimals));
    return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function short(addr) {
    if (!addr) return "";
    return addr.slice(0, 6) + "…" + addr.slice(-4);
  }

  function Coin({ face, spinIndex, flipping, spinning, size = 176 }) {
    const rotation = spinIndex * 1080 + (face === "tails" ? 180 : 0);
    return (
      <div style={{
        width: size, height: size, margin: "0 auto",
        perspective: 900,
        filter: (flipping || spinning) ? "drop-shadow(0 0 26px rgba(13,148,136,0.28))" : "drop-shadow(0 8px 16px rgba(10,13,12,0.12))",
      }}>
        <div style={{
          position: "relative", width: "100%", height: "100%",
          transformStyle: "preserve-3d",
          transform: flipping ? `rotateY(${rotation}deg)` : undefined,
          transition: flipping ? "transform 1.65s cubic-bezier(0.2, 0.9, 0.25, 1)" : "transform 0.5s ease",
          animation: spinning ? "coinIdleSpin 0.9s linear infinite" : "none",
        }}>
          <div style={{
            position: "absolute", inset: 0, borderRadius: "50%",
            backfaceVisibility: "hidden",
            background: `radial-gradient(circle at 32% 28%, #FFFFFF, #F0F3F2 72%)`,
            border: `2px solid ${c.mintBorder}`,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "inset 0 0 0 6px rgba(13,148,136,0.06)",
          }}>
            <img src={HEADS_IMG} alt="Heads" style={{ width: "72%", height: "72%", objectFit: "cover", borderRadius: "50%" }} onError={(e)=>{e.target.style.display='none';}} />
          </div>
          <div style={{
            position: "absolute", inset: 0, borderRadius: "50%",
            backfaceVisibility: "hidden",
            transform: "rotateY(180deg)",
            background: `radial-gradient(circle at 32% 28%, #FFFFFF, #F5F1E7 72%)`,
            border: `2px solid ${c.goldBorder}`,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "inset 0 0 0 6px rgba(183,121,31,0.06)",
          }}>
            <img src={TAILS_IMG} alt="Tails" style={{ width: "50%", height: "50%", objectFit: "contain" }} onError={(e)=>{e.target.style.display='none';}} />
          </div>
        </div>
      </div>
    );
  }

  function SideButton({ label, img, active, onClick, accent }) {
    return (
      <button
        onClick={onClick}
        style={{
          flex: 1,
          display: "flex", flexDirection: "column", alignItems: "center", gap: 8,
          padding: "14px 10px",
          borderRadius: 16,
          background: active ? (accent === "gold" ? c.goldBg : c.mintBg) : c.field,
          border: `1.5px solid ${active ? (accent === "gold" ? c.goldBorder : c.mintBorder) : c.borderSoft}`,
          cursor: "pointer",
          transition: "all 0.15s ease",
        }}
      >
        <div style={{
          width: 40, height: 40, borderRadius: "50%",
          background: c.panel, display: "flex", alignItems: "center", justifyContent: "center",
          border: `1px solid ${c.border}`,
        }}>
          <img src={img} alt={label} style={{ width: "70%", height: "70%", objectFit: "cover", borderRadius: "50%" }} onError={(e)=>{e.target.style.display='none';}} />
        </div>
        <span style={{
          fontSize: 13, fontWeight: 700,
          color: active ? (accent === "gold" ? c.gold : c.mint) : c.textMuted,
        }}>
          {label}
        </span>
      </button>
    );
  }

  function Spinner({ color = "#000" }) {
    return (
      <svg className="spin" width="16" height="16" viewBox="0 0 24 24" style={{ display: "inline-block", verticalAlign: "-3px", marginRight: 8 }}>
        <circle cx="12" cy="12" r="10" stroke={color} strokeOpacity="0.25" strokeWidth="3" fill="none" />
        <path d="M22 12a10 10 0 0 0-10-10" stroke={color} strokeWidth="3" fill="none" strokeLinecap="round" />
      </svg>
    );
  }

  function CoinFlipGame() {
    const [provider, setProvider] = useState(null);
    const [signer, setSigner] = useState(null);
    const [account, setAccount] = useState(null);
    const [chainIdHex, setChainIdHex] = useState(null);
    const [connecting, setConnecting] = useState(false);
    const [switching, setSwitching] = useState(false);

    const [decimals, setDecimals] = useState(18);
    const [tokenBalance, setTokenBalance] = useState(null);
    const [allowance, setAllowance] = useState(null);
    const [betTiers, setBetTiers] = useState([]);
    const [paused, setPaused] = useState(false);
    const [houseBalance, setHouseBalance] = useState(null);

    const [guess, setGuess] = useState("heads");
    const [selectedTier, setSelectedTier] = useState(null);
    const [busy, setBusy] = useState(false);
    const [busyLabel, setBusyLabel] = useState("");
    const [approving, setApproving] = useState(false);
    const [flipping, setFlipping] = useState(false);
    const [spinIndex, setSpinIndex] = useState(0);
    const [coinFace, setCoinFace] = useState("heads");
    const [result, setResult] = useState(null);
    const [error, setError] = useState("");
    const [history, setHistory] = useState([]);
    const [historyLoading, setHistoryLoading] = useState(false);
    const [historyError, setHistoryError] = useState("");
    const [animGen, setAnimGen] = useState(0);

    const publicProviderRef = useRef(null);
    if (!publicProviderRef.current) {
      try { publicProviderRef.current = new ethers.JsonRpcProvider(RPC_URL); } catch (e) {}
    }
    const readProvider = provider || publicProviderRef.current;

    const onSepolia = chainIdHex === SEPOLIA_CHAIN_ID_HEX;
    function getInjectedProvider() {
      if (typeof window === "undefined") return null;
      if (window.ethereum) return window.ethereum;
      try {
        if (window.parent && window.parent !== window && window.parent.ethereum) {
          return window.parent.ethereum;
        }
      } catch (e) {}
      return null;
    }

    const injectedProvider = getInjectedProvider();
    const hasInjected = !!injectedProvider;
    const betUnits = useMemo(() => {
      if (selectedTier === null || !betTiers[selectedTier]) return null;
      return betTiers[selectedTier];
    }, [selectedTier, betTiers]);

    const needsApproval = betUnits !== null && betUnits > 0n && (allowance === null || allowance < betUnits);

    const connectWallet = useCallback(async () => {
      setError("");
      const eth = getInjectedProvider();
      if (!eth) {
        setError("No wallet found. Open this page inside your wallet's browser.");
        return;
      }

      setConnecting(true);
      try {
        const p = new ethers.BrowserProvider(eth);
        const accounts = await p.send("eth_requestAccounts", []);
        const net = await p.getNetwork();
        const s = await p.getSigner();
        setProvider(p);
        setSigner(s);
        setAccount(accounts[0]);
        setChainIdHex("0x" + net.chainId.toString(16));
      } catch (err) {
        setError(err?.info?.error?.message || err?.shortMessage || err.message || "Failed to connect wallet.");
      } finally {
        setConnecting(false);
      }
    }, []);

    const switchToSepolia = useCallback(async () => {
      setError("");
      setSwitching(true);
      try {
        const eth = getInjectedProvider();
        await eth.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: SEPOLIA_CHAIN_ID_HEX }],
        });
      } catch (err) {
        if (err && err.code === 4902) {
          try {
            await eth.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: SEPOLIA_CHAIN_ID_HEX,
                chainName: "Sepolia",
                rpcUrls: [RPC_URL],
                nativeCurrency: { name: "Sepolia ETH", symbol: "ETH", decimals: 18 },
                blockExplorerUrls: ["https://sepolia.etherscan.io"],
              }],
            });
          } catch (err2) {
            setError(err2?.message || "Failed to add Sepolia network.");
          }
        } else {
          setError(err?.message || "Failed to switch network.");
        }
      } finally {
        setSwitching(false);
      }
    }, []);

    const disconnectWallet = useCallback(async () => {
      setError("");
      try {
        const eth = getInjectedProvider();
        if (eth && eth.request) {
          try {
            await eth.request({
              method: "wallet_revokePermissions",
              params: [{ eth_accounts: {} }],
            });
          } catch (revokeErr) {}
        }
      } finally {
        setProvider(null);
        setSigner(null);
        setAccount(null);
        setChainIdHex(null);
        setTokenBalance(null);
        setAllowance(null);
        setResult(null);
        setSelectedTier(null);
        setHistory([]);
      }
    }, []);

    useEffect(() => {
      const eth = getInjectedProvider();
      if (!eth) return;
      const onAccountsChanged = (accs) => {
        if (!accs || accs.length === 0) {
          setAccount(null); setSigner(null); setProvider(null);
        } else {
          setAccount(accs[0]);
        }
      };
      const onChainChanged = async (hex) => {
        setChainIdHex(hex);
        try {
          const p = new ethers.BrowserProvider(eth);
          const net = await p.getNetwork();
          setProvider(p);
          setChainIdHex("0x" + net.chainId.toString(16));
          if (account) {
            try {
              const s = await p.getSigner();
              setSigner(s);
            } catch (e) {}
          }
        } catch (e) {}
      };
      eth.on && eth.on("accountsChanged", onAccountsChanged);
      eth.on && eth.on("chainChanged", onChainChanged);
      return () => {
        eth.removeListener && eth.removeListener("accountsChanged", onAccountsChanged);
        eth.removeListener && eth.removeListener("chainChanged", onChainChanged);
      };
    }, [account]);

    const refreshPublicData = useCallback(async () => {
      if (!readProvider) return;
      try {
        const token = new ethers.Contract(TOKEN_ADDRESS, ERC20_ABI, readProvider);
        const game = new ethers.Contract(COINFLIP_ADDRESS, COINFLIP_ABI, readProvider);
        const dec = await token.decimals();
        setDecimals(Number(dec));

        const [tiers, isPaused, house] = await Promise.all([
          game.getBetTiers(), game.paused(), game.houseBalance(),
        ]);
        setBetTiers(tiers);
        setPaused(isPaused);
        setHouseBalance(house);
      } catch (err) {
        console.warn("refreshPublicData failed", err);
      }
    }, [readProvider]);

    const refreshAccountData = useCallback(async () => {
      if (!provider || !account || !onSepolia) return;
      try {
        const token = new ethers.Contract(TOKEN_ADDRESS, ERC20_ABI, provider);
        const [bal, allw] = await Promise.all([
          token.balanceOf(account),
          token.allowance(account, COINFLIP_ADDRESS),
        ]);
        setTokenBalance(bal);
        setAllowance(allw);
      } catch (err) {
        setError(err?.shortMessage || err.message || "Failed to load account data.");
      }
    }, [provider, account, onSepolia]);

    const refreshData = useCallback(async () => {
      await refreshPublicData();
      await refreshAccountData();
    }, [refreshPublicData, refreshAccountData]);

    useEffect(() => { refreshPublicData(); }, [refreshPublicData]);
    useEffect(() => { refreshAccountData(); }, [refreshAccountData]);

    const loadHistory = useCallback(async () => {
      if (!account || !readProvider) { setHistory([]); return; }
      setHistoryLoading(true);
      setHistoryError("");
      try {
        const game = new ethers.Contract(COINFLIP_ADDRESS, COINFLIP_ABI, readProvider);
        const filter = game.filters.Flipped(null, account);
        const latestBlock = await readProvider.getBlockNumber();
        const fromBlock = Math.max(0, latestBlock - HISTORY_LOOKBACK_BLOCKS);

        let logs = [];
        let failedChunks = 0;
        let totalChunks = 0;
        for (let start = fromBlock; start <= latestBlock; start += LOG_QUERY_CHUNK) {
          const end = Math.min(start + LOG_QUERY_CHUNK - 1, latestBlock);
          totalChunks += 1;
          try {
            const chunkLogs = await game.queryFilter(filter, start, end);
            logs = logs.concat(chunkLogs);
          } catch (chunkErr) {
            failedChunks += 1;
            console.warn("loadHistory chunk failed", start, end, chunkErr);
          }
        }

        const items = logs.slice(-5).reverse().map((log) => ({
          txHash: log.transactionHash,
          amount: log.args.amount,
          guessHeads: log.args.guessHeads,
          result: log.args.result,
          won: log.args.won,
          payout: log.args.payout,
        }));
        setHistory(items);
        if (failedChunks > 0 && items.length === 0) {
          setHistoryError("Some history couldn't be loaded from the RPC node. Try again in a moment.");
        }
      } catch (err) {
        console.warn("loadHistory failed", err);
        setHistoryError(err?.shortMessage || err.message || "Failed to load history.");
      } finally {
        setHistoryLoading(false);
      }
    }, [account, readProvider]);

    useEffect(() => { loadHistory(); }, [loadHistory]);

    const doApprove = useCallback(async () => {
      if (!signer || betUnits === null) return;
      setError("");
      setBusy(true);
      setAnimGen((g) => g + 1);
      setApproving(true);
      setBusyLabel("Confirm approval in your wallet...");
      try {
        const token = new ethers.Contract(TOKEN_ADDRESS, ERC20_ABI, signer);
        const tx = await token.approve(COINFLIP_ADDRESS, ethers.MaxUint256);
        setBusyLabel("Approving...");
        await tx.wait();
        await refreshData();
      } catch (err) {
        setError(err?.info?.error?.message || err?.shortMessage || err.message || "Approve failed.");
      } finally {
        setBusy(false);
        setApproving(false);
        setBusyLabel("");
      }
    }, [signer, betUnits, refreshData]);

    const runFlip = useCallback(async () => {
      setError("");
      setResult(null);

      if (!account || !signer) {
        setError("Connect your wallet first.");
        return;
      }
      if (!onSepolia) {
        setError("Switch to Sepolia network first.");
        return;
      }
      if (betUnits === null || betUnits <= 0n) {
        setError("Pick a bet amount.");
        return;
      }
      if (tokenBalance !== null && betUnits > tokenBalance) {
        setError("Insufficient balance.");
        return;
      }
      if (paused) {
        setError("Game is paused right now.");
        return;
      }

      try {
        const game = new ethers.Contract(COINFLIP_ADDRESS, COINFLIP_ABI, signer);
        const gameRead = new ethers.Contract(COINFLIP_ADDRESS, COINFLIP_ABI, readProvider);

        setBusy(true);
        setBusyLabel("Checking bet...");
        const valid = await game.isValidBet(betUnits);
        if (!valid) {
          setError("This bet amount is not a valid tier.");
          setBusy(false);
          setBusyLabel("");
          return;
        }

        setAnimGen((g) => g + 1);

        // --- Step 1: placeBet. This transaction never reveals the outcome —
        // it only moves the bet amount into the contract. A wallet's preview
        // of this tx will only ever show "-amount", with no way to know win/lose.
        setApproving(true);
        setBusyLabel("Confirm your bet in your wallet...");
        const placeTx = await game.placeBet(betUnits, guess === "heads");
        setApproving(false);

        setBusyLabel("Placing bet...");
        setFlipping(true);
        setSpinIndex((i) => i + 1);
        const placeReceipt = await placeTx.wait();

        let betId = null;
        let targetBlock = null;
        for (const log of placeReceipt.logs) {
          try {
            const ev = game.interface.parseLog(log);
            if (ev && ev.name === "BetPlaced") {
              betId = ev.args.betId;
              targetBlock = ev.args.targetBlock;
              break;
            }
          } catch (_) {}
        }
        if (betId === null) throw new Error("Could not find BetPlaced event — bet may not have been recorded.");

        // Immediately resync balance/allowance since the bet amount already
        // left the wallet at this point, independent of win/lose.
        refreshData();

        // --- Step 2: wait for the target block to actually exist on chain,
        // then resolve. Nobody — not even this tab — can know the outcome
        // before that block is mined.
        setBusyLabel("Waiting for the settlement block...");
        let currentBlock = await readProvider.getBlockNumber();
        while (currentBlock <= Number(targetBlock)) {
          await new Promise((resolve) => setTimeout(resolve, RESOLVE_POLL_INTERVAL_MS));
          currentBlock = await readProvider.getBlockNumber();
        }

        setBusyLabel("Confirm settlement in your wallet...");
        let parsed = null;
        try {
          const resolveTx = await game.resolveBet(betId);
          setBusyLabel("Settling...");
          const resolveReceipt = await resolveTx.wait();
          for (const log of resolveReceipt.logs) {
            try {
              const ev = game.interface.parseLog(log);
              if (ev && ev.name === "Flipped") { parsed = ev; break; }
            } catch (_) {}
          }
        } catch (resolveErr) {
          // Someone else (frontend/keeper/other player) may have resolved
          // this bet first — that's fine, just read the settled outcome.
          const bet = await gameRead.getBet(betId);
          if (!bet.resolved) throw resolveErr;
          parsed = {
            args: {
              result: bet.result,
              won: bet.won,
              payout: bet.payout,
            },
          };
        }

        const faceResult = parsed ? (parsed.args.result ? "heads" : "tails") : guess;
        const won = parsed ? parsed.args.won : null;
        const payout = parsed ? parsed.args.payout : 0n;

        setCoinFace(faceResult);
        setResult({ won, payout, txHash: placeReceipt.hash });
        await refreshData();
        await loadHistory();
      } catch (err) {
        const raw = err?.info?.error?.message || err?.shortMessage || err.message || "Transaction failed.";
        setError(raw);
      } finally {
        setApproving(false);
        setFlipping(false);
        setBusy(false);
        setBusyLabel("");
        refreshData();
      }
    }, [account, signer, readProvider, onSepolia, betUnits, tokenBalance, paused, guess, refreshData, loadHistory]);

    let ctaLabel = "Flip Coin";
    if (!account) ctaLabel = "Connect Wallet";
    else if (!onSepolia) ctaLabel = "Switch to Sepolia";
    else if (needsApproval) ctaLabel = `Approve ${TOKEN_SYMBOL}`;
    else if (busy || flipping) ctaLabel = busyLabel || "Working...";

    const ctaDisabled = busy || flipping || connecting || switching;

    const handleCta = () => {
      if (!account) { connectWallet(); return; }
      if (!onSepolia) { switchToSepolia(); return; }
      if (needsApproval) { doApprove(); return; }
      runFlip();
    };

    return (
      <div style={{
        minHeight: "100vh",
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: "32px 16px",
      }}>
        <div style={{ width: "100%", maxWidth: 420 }}>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
            <div>
              <div className="display" style={{ fontSize: 22, fontWeight: 700, letterSpacing: 0.2, color: c.textMain }}>
                Coin<span style={{ color: c.mint }}>Flip</span>
              </div>
              <div style={{ fontSize: 12, color: c.textMuted, marginTop: 2 }}>
                Double or nothing, in {TOKEN_SYMBOL} · fair 2-step settlement
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
              <span style={{
                background: onSepolia ? c.mintBg : c.dangerBg,
                color: onSepolia ? c.mint : c.danger,
                fontSize: 11.5, fontWeight: 600,
                padding: "5px 10px", borderRadius: 999,
                border: `1px solid ${onSepolia ? c.mintBorder : "rgba(220,38,38,0.3)"}`,
              }}>
                {account ? (onSepolia ? "Sepolia" : "Wrong network") : "Not connected"}
              </span>
              {account && (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, color: c.textFaint }}>
                    {short(account)}
                  </span>
                  <button
                    onClick={disconnectWallet}
                    disabled={busy || flipping}
                    style={{
                      background: "none", border: "none", padding: 0,
                      fontSize: 11, color: c.danger, textDecoration: "underline",
                      cursor: (busy || flipping) ? "not-allowed" : "pointer",
                      opacity: (busy || flipping) ? 0.5 : 1,
                    }}
                  >
                    Disconnect
                  </button>
                </div>
              )}
            </div>
          </div>

          <div style={{
            background: c.panel, borderRadius: 24, padding: "28px 22px 24px",
            border: `1px solid ${c.border}`,
            boxShadow: "0 4px 24px rgba(10,13,12,0.06)",
          }}>

            <div style={{ position: "relative", padding: "6px 0 4px" }}>
              <div style={{
                position: "absolute", left: "50%", top: "52%", transform: "translate(-50%,-50%)",
                width: 190, height: 190, borderRadius: "50%",
                background: `radial-gradient(circle, ${(flipping || approving) ? "rgba(13,148,136,0.14)" : "rgba(13,148,136,0.05)"} 0%, transparent 70%)`,
                animation: (flipping || approving) ? "none" : "floatGlow 3.5s ease-in-out infinite",
                pointerEvents: "none",
              }} />
              <Coin key={animGen} face={coinFace} spinIndex={spinIndex} flipping={flipping} spinning={approving} />
            </div>

            <div style={{ minHeight: 46, display: "flex", alignItems: "center", justifyContent: "center", marginTop: 6 }}>
              {(flipping || approving) ? (
                <div style={{ fontSize: 13.5, color: c.textMuted, animation: "popIn 0.2s ease" }}>
                  <Spinner color={c.textMuted} />{busyLabel || (approving ? "Confirming in wallet…" : "Flipping the coin…")}
                </div>
              ) : result ? (
                <div style={{ textAlign: "center", animation: "popIn 0.25s ease" }}>
                  <div className="display" style={{
                    fontSize: 16, fontWeight: 700,
                    color: result.won ? c.mint : c.danger,
                  }}>
                    {result.won ? `You won ${fmt(result.payout, decimals)} ${TOKEN_SYMBOL}` : "Better luck next time"}
                  </div>
                  {result.won && (
                    <div style={{ fontSize: 11.5, color: c.textFaint, marginTop: 2 }}>
                      Payout sent automatically — nothing else to claim.
                    </div>
                  )}
                  {result.reverted && (
                    <div style={{ fontSize: 11.5, color: c.textFaint, marginTop: 2 }}>
                      No on-chain record for this loss — the transaction reverted.
                    </div>
                  )}
                  {result.txHash && (
                    <a
                      href={`https://sepolia.etherscan.io/tx/${result.txHash}`}
                      target="_blank" rel="noopener noreferrer"
                      style={{ fontSize: 11.5, color: c.textFaint, textDecoration: "underline" }}
                    >
                      View transaction
                    </a>
                  )}
                </div>
              ) : (
                <div style={{ fontSize: 13, color: c.textFaint }}>
                  Pick a side and place your bet
                </div>
              )}
            </div>

            <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
              <SideButton label="Heads" img={HEADS_IMG} active={guess === "heads"} onClick={() => setGuess("heads")} accent="mint" />
              <SideButton label="Tails" img={TAILS_IMG} active={guess === "tails"} onClick={() => setGuess("tails")} accent="gold" />
            </div>

            <div style={{
              background: c.field, borderRadius: 16, padding: 16, marginTop: 14,
              border: `1px solid ${c.borderSoft}`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <label style={{ fontSize: 12.5, color: c.textMuted }}>Bet amount</label>
                {tokenBalance !== null && (
                  <span style={{ fontSize: 11.5, color: c.textFaint }}>
                    Balance: {fmt(tokenBalance, decimals)} {TOKEN_SYMBOL}
                  </span>
                )}
              </div>
              {betTiers.length > 0 ? (
                <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                  {betTiers.map((tier, i) => (
                    <button
                      key={i}
                      onClick={() => setSelectedTier(i)}
                      style={{
                        flex: "1 0 auto", minWidth: 70, padding: "10px 0", borderRadius: 10,
                        background: selectedTier === i ? c.mintBg : c.card,
                        border: `1.5px solid ${selectedTier === i ? c.mintBorder : c.borderSoft}`,
                        color: selectedTier === i ? c.mint : c.textMuted,
                        fontWeight: selectedTier === i ? 700 : 500,
                        fontSize: 13.5, cursor: "pointer",
                      }}
                    >
                      {fmt(tier, decimals)}
                    </button>
                  ))}
                </div>
              ) : (
                <div style={{ fontSize: 12.5, color: c.textFaint, marginTop: 8 }}>
                  Loading bet tiers…
                </div>
              )}
            </div>

            <div style={{ fontSize: 11.5, color: c.textFaint, marginTop: 10 }}>
              Fixed bet tiers · 2x payout on win
            </div>
            {houseBalance !== null && (
              <div style={{ fontSize: 11, color: c.textFaint, marginTop: 2 }}>
                House balance: {fmt(houseBalance, decimals)} {TOKEN_SYMBOL}
              </div>
            )}

            <button
              onClick={handleCta}
              disabled={ctaDisabled}
              style={{
                width: "100%", marginTop: 16,
                background: ctaDisabled ? c.card : c.mint,
                border: "none", borderRadius: 999, padding: 16,
                fontWeight: 700, fontSize: 15.5,
                color: ctaDisabled ? c.textFaint : "#FFFFFF",
                cursor: ctaDisabled ? "not-allowed" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}
            >
              {(busy || flipping || connecting || switching) && <Spinner color={ctaDisabled ? "rgba(10,13,12,0.4)" : "#fff"} />}
              {ctaLabel}
            </button>

            {error && (
              <div style={{ fontSize: 12.5, color: c.danger, marginTop: 10, textAlign: "center" }}>
                {error}
              </div>
            )}

            {paused && (
              <div style={{ fontSize: 12, color: c.gold, marginTop: 10, textAlign: "center" }}>
                Game is paused right now — check back later.
              </div>
            )}
          </div>

          {account && (
            <div style={{
              background: c.panel, borderRadius: 24, padding: "20px 18px",
              border: `1px solid ${c.border}`, marginTop: 16,
              boxShadow: "0 4px 24px rgba(10,13,12,0.06)",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={{ fontSize: 13.5, fontWeight: 700, color: c.textMain }}>Flip History</div>
                {historyLoading && <Spinner color={c.textFaint} />}
              </div>
              {history.length === 0 ? (
                <div style={{ fontSize: 12.5, color: c.textFaint }}>
                  {historyLoading ? "Loading history…" : (historyError || "No flip history yet for this wallet.")}
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {history.map((h, i) => (
                    <a
                      key={h.txHash + i}
                      href={`https://sepolia.etherscan.io/tx/${h.txHash}`}
                      target="_blank" rel="noopener noreferrer"
                      style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "10px 12px", borderRadius: 12, background: c.field,
                        textDecoration: "none",
                      }}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{
                          width: 8, height: 8, borderRadius: "50%",
                          background: h.won ? c.mint : c.danger, flexShrink: 0,
                        }} />
                        <div>
                          <div style={{ fontSize: 12.5, color: c.textMain, fontWeight: 700 }}>
                            {h.won ? "Won" : "Lost"}
                          </div>
                          <div style={{ fontSize: 11, color: c.textFaint }}>
                            Guessed {h.guessHeads ? "Heads" : "Tails"} · Result {h.result ? "Heads" : "Tails"}
                          </div>
                        </div>
                      </div>
                      <div style={{ fontSize: 12.5, fontWeight: 700, color: h.won ? c.mint : c.textFaint }}>
                        {h.won ? `+${fmt(h.payout, decimals)}` : `-${fmt(h.amount, decimals)}`} {TOKEN_SYMBOL}
                      </div>
                    </a>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  const rootEl = document.getElementById('root');
  try {
    ReactDOM.createRoot(rootEl).render(<CoinFlipGame />);
    rootEl.dataset.mounted = "true";
  } catch (err) {
    rootEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'color:#DC2626;font-family:system-ui,sans-serif;font-size:14px;text-align:center;padding:24px;">' +
      'An error occurred while rendering the game.<br/>' +
      '<span style="opacity:.6;font-size:12px;">(' + err.message + ')</span></div>';
    console.error(err);
  }
</script>

<script>
  (function () {
    try {
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      var rootEl = document.getElementById('root');
      rootEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'color:#DC2626;font-family:system-ui,sans-serif;font-size:14px;text-align:center;padding:24px;">' +
        'Failed to compile the script.<br/>' +
        '<span style="opacity:.6;font-size:12px;">(' + err.message + ')</span></div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
